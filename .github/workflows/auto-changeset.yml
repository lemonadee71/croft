name: Auto Changeset

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-changeset:
    if: |
      contains(github.event.pull_request.labels.*.name, 'patch')
      || contains(github.event.pull_request.labels.*.name, 'minor')
      || contains(github.event.pull_request.labels.*.name, 'major')
      || contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create changeset if none exists
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          LABELS=$(jq -c '.pull_request.labels' "$GITHUB_EVENT_PATH")

          CHANGESET_FILE=".changeset/auto-pr-${PR_NUMBER}.md"
          mkdir -p .changeset

          # Remove previous changeset for THIS PR only
          if [ -f "$CHANGESET_FILE" ]; then
            rm "$CHANGESET_FILE"
            echo "Removed previous changeset for PR #$PR_NUMBER"
          fi

          # Determine bump type
          BUMP="patch"
          if echo "$LABELS" | grep -q '"major"'; then
            BUMP="major"
          elif echo "$LABELS" | grep -q '"minor"'; then
            BUMP="minor"
          fi

          # Write new changeset file
          {
            echo "---"
            echo "\"@lemonadee/croft\": $BUMP"
            echo "---"
            echo ""
            echo "$PR_TITLE"
            if [ -n "$PR_BODY" ] && [ "$PR_BODY" != "null" ]; then
              echo ""
              echo "$PR_BODY"
            fi
          } > "$CHANGESET_FILE"

          echo "Created $CHANGESET_FILE with $BUMP bump"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore: auto-generate changeset for PR #$PR_NUMBER ($BUMP)"
          git push
